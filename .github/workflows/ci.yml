name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: build demo binaries
        run: |
          go build ./cmd/...

  mcp-go-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mcp-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/mcp-go/go.mod
          cache-dependency-path: examples/mcp-go/go.sum
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
